name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-stdlib:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies (zero runtime deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and invariant test suite
        run: python -m pytest -v

      - name: Verify pure-stdlib execution without Rust CDLL
        run: |
          python -c "import shutil, pytest; shutil.which = lambda _: None; raise SystemExit(pytest.main(['-q']))"

      - name: Run CLI mathematical self-verification and Pareto benchmark
        run: |
          python -m vld verify
          python -m vld benchmark --dim 512 --steps 5000

      - name: Verify sdist and wheel build cleanly
        run: python -m build

  verify-accelerated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with optional numerics
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,numerics]"

      - name: Run accelerated test suite and self-verification
        run: |
          python -m pytest -v
          python -m vld verify
